services:
  db:
    image: postgres:18-trixie
    container_name: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    restart: always
    volumes:
      - type: volume
        source: real-sns_db_data
        target: /var/lib/postgresql
        volume:
          nocopy: true
    ports:
      - "${DATABASE_PORT}:5432"
  ui:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # servers.json で使用する環境変数をpgAdminコンテナに渡す
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      # pgAdmin に servers.json の場所を教える
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - real-sns_pgadmin_data:/var/lib/pgadmin
      - ./config/servers.json.template:/pgadmin4/servers.json.template
      - ./pgadmin_entrypoint.sh:/pgadmin_entrypoint.sh
    entrypoint: [ "/bin/bash", "/pgadmin_entrypoint.sh" ]
    depends_on:
      - db
  fs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_CONSOLE_ENABLE=true

    volumes:
      - real-sns_rustfs_data:/data

volumes:
  real-sns_db_data:
  real-sns_pgadmin_data:
  real-sns_rustfs_data: